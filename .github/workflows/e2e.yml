name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  E2E_DIR: tests/e2e

# Third-party actions use readable upstream release refs. Dependabot proposes
# updates weekly; review their release notes and let CI test each change.
#
# Each E2E group runs as a separate matrix job so they execute in
# parallel. Total wall-clock is bounded by the slowest group instead
# of the previous ~6+ minute single sequential job.
#
# v5.1.2 split the previous `Redundancy and Stats` job into two so the
# heaviest group no longer gated the matrix on its own. v6.1 split the
# two remaining long poles: `UPS Single` -> `UPS Single Core` +
# `UPS Single Auth`, and `Redundancy` -> `Redundancy Quorum` +
# `Redundancy Regression`, bringing the matrix to EIGHT parallel E2E
# jobs. (Image builds are also cached across groups now via buildx +
# the GitHub Actions cache; see .github/actions/e2e-setup.)
#
# OPERATOR ACTION REQUIRED before merge: branch protection on `main`
# still lists the old check names, so PRs wedge on "expected, never
# reported" until it is updated. Remove required checks `E2E UPS Single`
# and `E2E Redundancy`; add the four new jobs. The eight required E2E
# checks are then:
#   - E2E CLI
#   - E2E UPS Single Core
#   - E2E UPS Single Auth
#   - E2E UPS Multi
#   - E2E Redundancy Quorum
#   - E2E Redundancy Regression
#   - E2E Stats
#   - E2E Loopback
# (The validate side also changes in v6.1 — reduced PR matrix; make only
# the 3.9 + 3.12 validate checks required. See validate.yml.)
#
# ISS-042: least-privilege token — E2E only reads the repo and pulls public
# base images; it never writes releases, packages, or pages.
permissions:
  contents: read

jobs:
  e2e:
    name: "E2E ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: cli,                   label: "CLI" }
          - { group: single-ups-core,       label: "UPS Single Core" }
          - { group: single-ups-auth,       label: "UPS Single Auth" }
          - { group: multi-ups,             label: "UPS Multi" }
          - { group: redundancy-quorum,     label: "Redundancy Quorum" }
          - { group: redundancy-regression, label: "Redundancy Regression" }
          - { group: stats,                 label: "Stats" }
          - { group: loopback,              label: "Loopback" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          e2e-dir: ${{ env.E2E_DIR }}

      - name: "Run E2E group: ${{ matrix.label }}"
        env:
          # Test 7 (single-ups-core.sh) needs this secret to actually verify
          # notification delivery; without it the test SKIPs. The per-
          # step env was dropped when this workflow was split into the
          # matrix groups in commit ade1d16 — restoring it on every
          # matrix entry is harmless (only Test 7 reads it) and avoids
          # making the workflow group-aware.
          E2E_NOTIFICATION_URL: ${{ secrets.E2E_NOTIFICATION_URL }}
          # ISS-051: on contexts that CAN see the secret (push to main, or a
          # PR from a branch in this repo — not a fork), an empty
          # E2E_NOTIFICATION_URL is a hard FAIL rather than a silent SKIP, so
          # a rotated/unset secret can't leave Test 7 permanently un-run. Fork
          # PRs have no secret access and legitimately keep the SKIP.
          # Dependabot-triggered runs receive Dependabot secrets, not Actions
          # secrets, so the URL is legitimately empty there too — treat them
          # like forks (SKIP, not FAIL).
          E2E_EXPECT_NOTIFICATION_SECRET: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false) && github.actor != 'dependabot[bot]' && '1' || '' }}
          # Bypass the v5.4 "is_local requires root" startup check so
          # eneru runs as the runner user. Sudo-elevating eneru would
          # leave its SQLite DB and state files root-owned, which then
          # breaks subsequent tests that read/write those files as the
          # runner user. The check is documented as a testing/dry-run
          # bypass; production containers never set it.
          ENERU_SKIP_PRIVILEGE_CHECK: "1"
        run: |
          # F-144: every group script ends with a completion line; requiring
          # it catches an early `exit 0` that would skip the remaining tests
          # while still reporting green.
          set -o pipefail
          bash tests/e2e/groups/${{ matrix.group }}.sh 2>&1 | tee /tmp/e2e-group-run.log
          grep -qx "=== Group '${{ matrix.group }}' completed successfully ===" /tmp/e2e-group-run.log

      - name: Verify every E2E group script has a matrix entry
        if: matrix.group == 'cli'
        run: |
          # F-144: a new tests/e2e/groups/<name>.sh without a matrix entry
          # would never run, and nothing else would notice. lib.sh is the
          # shared helper file, not a group.
          missing=0
          for script in tests/e2e/groups/*.sh; do
            name="$(basename "$script" .sh)"
            [ "$name" = "lib" ] && continue
            if ! grep -Eq "^[[:space:]]*- \{ group: ${name}," .github/workflows/e2e.yml; then
              echo "::error::tests/e2e/groups/${name}.sh has no matrix entry in e2e.yml"
              missing=1
            fi
            # The completion line must be the LAST non-empty line, so no
            # test can hide after it.
            [ "$(sed '/^[[:space:]]*$/d' "$script" | tail -n 1)" = "echo \"=== Group '${name}' completed successfully ===\"" ] || {
              echo "::error::tests/e2e/groups/${name}.sh must end with its completion line"
              missing=1
            }
            # A group that calls a lib.sh helper must source lib.sh, or the
            # call dies with "command not found" mid-run.
            helpers="$(grep -oE '^[a-z_]+\(\) \{' tests/e2e/groups/lib.sh | sed 's/() {//' | paste -sd'|')"
            if grep -Eq "(^|[^a-z_])(${helpers})([^a-z_]|$)" "$script" \
                && ! grep -q '^\. "\$E2E_DIR/groups/lib.sh"' "$script"; then
              echo "::error::tests/e2e/groups/${name}.sh calls a lib.sh helper without sourcing lib.sh"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify multi-UPS E2E coverage is wired
        if: matrix.group == 'multi-ups'
        run: |
          grep -q "Test 9: Multi-UPS isolation (UPS1 fails, UPS2 normal)" tests/e2e/groups/multi-ups.sh
          grep -q "Test 14: Multi-UPS concurrent failure (both UPSes fail)" tests/e2e/groups/multi-ups.sh
          grep -q "Test 15: Non-local failure (UPS2 fails, UPS1 unaffected)" tests/e2e/groups/multi-ups.sh
          grep -q "Test 16: Local drain (drain_on_local_shutdown=true)" tests/e2e/groups/multi-ups.sh
          grep -q "Test 19: Multi-phase shutdown ordering (shutdown_order)" tests/e2e/groups/multi-ups.sh
          # Isolation must stay asserted in both directions.
          grep -q 'Initiating remote shutdown: E2E SSH Target (UPS1)' tests/e2e/groups/multi-ups.sh
          grep -q 'Group E2E UPS2 shutdown complete. Exiting (--exit-after-shutdown)' tests/e2e/groups/multi-ups.sh

      - name: Verify redundancy regression E2E coverage is wired
        if: matrix.group == 'redundancy-regression'
        run: |
          grep -q "Regression R1: Runtime transient NUT loss stays inside redundancy grace" tests/e2e/groups/redundancy-regression.sh
          grep -q "Regression R2: Runtime persistent NUT loss fails safe after grace" tests/e2e/groups/redundancy-regression.sh
          grep -Eq "^[[:space:]]*stop_redundancy_nut_drivers[[:space:]]*$" tests/e2e/groups/redundancy-regression.sh

      - name: Verify v5.3 E2E coverage is wired
        if: matrix.group == 'single-ups-core'
        run: |
          # This step is a wiring guard for v5.3's E2E cases. The tests
          # themselves run in the group script above; these greps catch a
          # workflow/script mismatch where the release-critical cases were
          # renamed, moved, or accidentally dropped from the single-UPS
          # core job (split from single-ups in v6.1).
          grep -q "Test 39: On-battery stabilization suppresses transient critical readings" tests/e2e/groups/single-ups-core.sh
          grep -q "Test 40: Remote SSH healthcheck is harmless" tests/e2e/groups/single-ups-core.sh
          grep -q "Test 41: Manual remote dry-run executes no configured commands" tests/e2e/groups/single-ups-core.sh
          grep -q "Test 42: Manual confirmed remote shutdown reaches selected target" tests/e2e/groups/single-ups-core.sh
          grep -q "Test 43: Embedded API health/readiness/metrics" tests/e2e/groups/single-ups-core.sh
          grep -q "Test 44: Unreachable remote shutdown is bounded" tests/e2e/groups/single-ups-core.sh
          grep -q "Test 45: MQTT status publishes power-quality metrics" tests/e2e/groups/single-ups-core.sh
          grep -q "Test 46: OCI image runs with API enabled by CLI flags" tests/e2e/groups/single-ups-core.sh
          # 6.2.0 review (F-139/F-145): exact FSD reason, renumbered re-arm test.
          grep -q 'Triggering immediate shutdown. Reason: UPS signaled FSD (Forced Shutdown) flag.' tests/e2e/groups/single-ups-core.sh
          grep -q '^battery.charge: 80' tests/e2e/scenarios/fsd.dev
          grep -q "Test 70: Shutdown re-arm on POWER_RESTORED (bug #4)" tests/e2e/groups/single-ups-core.sh
          # 6.2 UX contract: outlook/role/freshness API fields + progress sidecar.
          grep -q "PASS (43a): next-trigger/role/freshness contract on the live API" tests/e2e/groups/single-ups-core.sh
          grep -q "eneru-e2e-state.shutdown-progress.json" tests/e2e/groups/single-ups-core.sh
          # 6.2.0 review cycle 3 (F-188): nextTrigger == the trigger the daemon fired.
          grep -q "PASS (43a): nextTrigger names the trigger the daemon fired" tests/e2e/groups/single-ups-core.sh
          grep -q 'assert fired\[0\] == "Battery charge 14% below threshold 20%"' tests/e2e/groups/single-ups-core.sh
          grep -q 'assert role\["kind"\] == "local", role' tests/e2e/groups/single-ups-core.sh
          # 6.2: a one-entry ups list honours an explicit is_local: false.
          grep -q "Test 71: One-entry ups list honours explicit is_local: false" tests/e2e/groups/single-ups-core.sh
          grep -qF 'write_is_local_config /tmp/config-e2e-islocal-false.yaml "is_local: false"' tests/e2e/groups/single-ups-core.sh
          grep -qF 'if grep -qF "Would execute: shutdown -h now" /tmp/test71a.log; then' tests/e2e/groups/single-ups-core.sh
          grep -qF 'WARNING: ups[0] has no is_local; as the only UPS it powers off this host on a shutdown trigger.' tests/e2e/groups/single-ups-core.sh

      - name: Verify v5.5 loopback E2E coverage is wired
        if: matrix.group == 'loopback'
        run: |
          grep -Eq "^[[:space:]]*run_loopback_case[[:space:]]+root[[:space:]]+root[[:space:]]+false[[:space:]]+19191[[:space:]]*$" tests/e2e/groups/loopback.sh
          grep -Eq "^[[:space:]]*run_loopback_case[[:space:]]+sudo[[:space:]]+testuser[[:space:]]+true[[:space:]]+19192[[:space:]]*$" tests/e2e/groups/loopback.sh
          grep -Eq "^[[:space:]]*negative_missing_machine_id[[:space:]]*$" tests/e2e/groups/loopback.sh
          grep -Eq "^[[:space:]]*negative_missing_loopback[[:space:]]*$" tests/e2e/groups/loopback.sh
          grep -Eq "^[[:space:]]*accept_new_known_hosts_remote[[:space:]]+19194[[:space:]]*$" tests/e2e/groups/loopback.sh
          grep -Eq "^[[:space:]]*container_config_edit_case[[:space:]]*$" tests/e2e/groups/loopback.sh
          grep -q "Test 68: in-container editor saves a writable config mount" tests/e2e/groups/loopback.sh
          grep -q 'stat -c %i "$dir/config.yaml")" = "$inode_before"' tests/e2e/groups/loopback.sh
          grep -q 'sudo cmp -s "$dir/ro-before.yaml" "$dir/config.yaml"' tests/e2e/groups/loopback.sh
          grep -q 'Config reload failed' tests/e2e/groups/loopback.sh
          grep -q "stop_vms" tests/e2e/groups/loopback.sh
          grep -q "stop_compose" tests/e2e/groups/loopback.sh
          grep -q "stop_containers_rootless" tests/e2e/groups/loopback.sh
          grep -q "unmount_filesystems" tests/e2e/groups/loopback.sh
          grep -Eq "^[[:space:]]*config_check_identity_autofill_case[[:space:]]*$" tests/e2e/groups/loopback.sh
          grep -q 'host-loopback: host identity matches (loopback reaches THIS host)' tests/e2e/groups/loopback.sh
          grep -qF 'grep -qF "[read-only]" /tmp/test68b.log' tests/e2e/groups/loopback.sh
          # F-189: the dry-run confirm must be on the captured screen.
          grep -qx '  assert_dry_run_confirm_shown /tmp/test68a.log on || exit 1' tests/e2e/groups/loopback.sh
          grep -q '^assert_dry_run_confirm_shown() {' tests/e2e/groups/lib.sh

      - name: Verify v6.0 E2E coverage is wired
        if: matrix.group == 'cli' || matrix.group == 'single-ups-auth'
        run: |
          # v6.0 wiring guard: auth CLI lifecycle (cli) and API auth login /
          # tiered config / write gating (single-ups-auth) must stay present.
          if [ "${{ matrix.group }}" = "cli" ]; then
            grep -q "Test 51: auth user + apikey CLI lifecycle" tests/e2e/groups/cli.sh
            grep -q "Test 58: NUT name autodiscovery self-heals single exposed UPS" tests/e2e/groups/cli.sh
          else
            grep -q "Test 52: API authentication login + tiered config + write gating" tests/e2e/groups/single-ups-auth.sh
            grep -q "Test 53: UPS control fail-closed + allowlist enforcement" tests/e2e/groups/single-ups-auth.sh
            grep -q "Test 54: Config hot-reload via SIGHUP and API" tests/e2e/groups/single-ups-auth.sh
            grep -q "Test 55: Browser dashboard served by embedded API" tests/e2e/groups/single-ups-auth.sh
            grep -q "Test 56: Event management" tests/e2e/groups/single-ups-auth.sh
          fi

      - name: Verify v6.1.2 self-test E2E coverage is wired
        if: matrix.group == 'single-ups-auth'
        run: |
          # v6.1.2 wiring guard: passive self-test observation + softened
          # permission (self_test without nut_control; effective auth via DB
          # user) must stay present, and the scenario file it depends on.
          grep -q "Test 62: self-test observation" tests/e2e/groups/single-ups-auth.sh
          grep -q "^ups.test.result:" tests/e2e/scenarios/self-test-passed.dev
          grep -q "Test 64: authenticated remote shutdown response and exit code" tests/e2e/groups/single-ups-auth.sh
          # F-189: the selfTestFailure outlook row is observed live (armed, fired).
          grep -q '\[ "$T5_IDLE" = "true idle - 3" \]' tests/e2e/groups/single-ups-auth.sh
          grep -q '\[ "$T5_FIRED" = "true fired selfTestFailure 3" \]' tests/e2e/groups/single-ups-auth.sh

      - name: Verify v6.2 report and self-test E2E coverage is wired
        if: matrix.group == 'stats' || matrix.group == 'single-ups-auth'
        run: |
          if [ "${{ matrix.group }}" = "stats" ]; then
            grep -q "PASS (35d): compact report uses display_name, energy tier" tests/e2e/groups/stats.sh
            grep -q "category='report'" tests/e2e/groups/stats.sh
            grep -q "E2E Restart UPS  0.008 kWh" tests/e2e/groups/stats.sh
          else
            grep -q "PASS (55a): dashboard labels are readable while API status stays raw" tests/e2e/groups/single-ups-auth.sh
            grep -q "self-test-running-on-battery" tests/e2e/groups/single-ups-auth.sh
            grep -q "self-test-failed-online" tests/e2e/groups/single-ups-auth.sh
            grep -q "self-test-failed-on-battery" tests/e2e/groups/single-ups-auth.sh
            grep -q "apply_scenario unknown-status" tests/e2e/groups/single-ups-auth.sh
            grep -q "^ups.test.result: In progress" tests/e2e/scenarios/self-test-running-on-battery.dev
            grep -q "^ups.test.result: Battery test failed" tests/e2e/scenarios/self-test-failed-online.dev
            grep -q "^ups.status: OB DISCHRG" tests/e2e/scenarios/self-test-failed-on-battery.dev
            grep -q "^ups.status: UNKNOWN" tests/e2e/scenarios/unknown-status.dev
          fi
          grep -q "PASS (34b): notification status is readable and stored event stays raw" tests/e2e/groups/stats.sh

      - name: Verify v6.1.7 drain-path E2E coverage is wired
        if: matrix.group == 'single-ups-core' || matrix.group == 'loopback'
        run: |
          if [ "${{ matrix.group }}" = "single-ups-core" ]; then
            grep -q "Test 59: Remote PATH augmentation always resolves bare commands" tests/e2e/groups/single-ups-core.sh
            grep -q "Test 60: Local Compose shutdown honors the configured timeout form" tests/e2e/groups/single-ups-core.sh
            grep -q 'shutdown_command: "eneru-path-probe"' tests/e2e/groups/single-ups-core.sh
            grep -q "/api/v1/ups/TestUPS%40localhost%3A3493/shutdown-progress" tests/e2e/groups/single-ups-core.sh
          else
            grep -q "Test 61: E2E delegated poweroff delivery writes completion marker" tests/e2e/groups/loopback.sh
            grep -Eq "^[[:space:]]*delegated_completion_marker_case[[:space:]]*$" tests/e2e/groups/loopback.sh
            grep -q '"reason": "sequence_complete"' tests/e2e/groups/loopback.sh
          fi

      - name: Verify v6.2 config editor E2E coverage is wired
        if: matrix.group == 'cli'
        run: |
          grep -q "Test 65: config check live-probes NUT, SSH, sudo and commands" tests/e2e/groups/cli.sh
          grep -q "Test 66: config editor TUI edits in place and creates new files" tests/e2e/groups/cli.sh
          # Grep the assertions themselves (not just their failure text).
          grep -q 'docker exec eneru-e2e-ssh test -e /var/run/shutdown-triggered' tests/e2e/groups/cli.sh
          grep -q 'docker exec eneru-e2e-ssh test -e /tmp/eneru-path-augmented' tests/e2e/groups/cli.sh
          grep -q "grep -qF \"Pinned OK: sudo allows 'shutdown -h now' without a password\"" tests/e2e/groups/cli.sh
          grep -q 'grep -qF "Pinned Wrong Args: sudo refuses it without a password"' tests/e2e/groups/cli.sh
          grep -q 'docker exec eneru-e2e-ssh test -e /root/eneru-custom-sudo' tests/e2e/groups/cli.sh
          grep -q "Test 67: use_sudo runs custom pre-shutdown commands via sudo" tests/e2e/groups/cli.sh
          grep -q "Test 69: remote shutdown with split ssh_options (-i/-p)" tests/e2e/groups/cli.sh
          grep -q 'docker exec eneru-e2e-ssh test -e /tmp/eneru-split-opts' tests/e2e/groups/cli.sh
          grep -q "Pinned Custom: sudo refuses it without a password: sudo allows 'touch /tmp/eneru-pinned-custom' without a password" tests/e2e/groups/cli.sh
          grep -q 'expect "== Shutdown order =="' tests/e2e/groups/cli.sh
          grep -q 'docker exec eneru-e2e-ssh test -e /tmp/shutdown-invoked' tests/e2e/groups/cli.sh
          grep -q 'touch /tmp/shutdown-invoked' tests/e2e/ssh-target/Dockerfile
          grep -q '\[1/1\] touch /root/eneru-custom-nosudo failed:' tests/e2e/groups/cli.sh
          test -f tests/e2e/config-tui-driver.py
          # F-189: the `y` in the key script answers a real dry-run prompt.
          grep -qx 'assert_dry_run_confirm_shown /tmp/test66a.log on || exit 1' tests/e2e/groups/cli.sh
          grep -q '^assert_dry_run_confirm_shown() {' tests/e2e/groups/lib.sh

      - name: Verify redundancy progress E2E coverage is wired
        if: matrix.group == 'redundancy-quorum'
        run: |
          grep -q "Test 63: Redundancy plan and live shutdown progress API" tests/e2e/groups/redundancy-quorum.sh
          grep -q "/api/v1/redundancy-groups/rack-1-dual-psu/shutdown-plan" tests/e2e/groups/redundancy-quorum.sh
          grep -q "/api/v1/redundancy-groups/rack-1-dual-psu/shutdown-progress" tests/e2e/groups/redundancy-quorum.sh
          grep -q "/power?from=" tests/e2e/groups/redundancy-quorum.sh
          grep -q 'nominal_power: 800' tests/e2e/config-e2e-redundancy.yaml
          grep -q 'ups.realpower.nominal: 1000' tests/e2e/scenarios/online-charging.dev
          grep -q 'remoteDetailAvailable' tests/e2e/groups/redundancy-quorum.sh
          # F-141: Tests 23/24 must really produce UNKNOWN members.
          grep -Eq "^[[:space:]]*stop_redundancy_nut_driver[[:space:]]+UPS2[[:space:]]*$" tests/e2e/groups/redundancy-quorum.sh
          grep -q 'UPS1@localhost:3493=critical, UPS2@localhost:3493=unknown' tests/e2e/groups/redundancy-quorum.sh
          grep -q 'UPS1@localhost:3493=unknown, UPS2@localhost:3493=unknown' tests/e2e/groups/redundancy-quorum.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          cd ${{ env.E2E_DIR }}
          docker compose logs

          echo ""
          echo "=== Eneru Test Logs ==="
          cat /tmp/test*.log 2>/dev/null || echo "No test logs found"

      - name: Cleanup
        if: always()
        run: |
          cd ${{ env.E2E_DIR }}
          docker compose down -v --remove-orphans
          sudo umount /tmp/eneru-e2e-tmpfs 2>/dev/null || true
